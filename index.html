<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easter Egg Hunt 2026</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #fcfaf2;
      color: #5d5d5d;
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 50px;
      color: #ffb7ce;
      text-shadow: 2px 2px 0px #fff;
      margin-bottom: 30px;
    }

    /* Container for our images */
    .egg-gallery {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .egg-img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      border-radius: 50%; /* Keeps them looking "egg-shaped" or circular */
      background: white;
      padding: 15px;
      box-shadow: 0 10px 15px rgba(0,0,0,0.05);
      animation: float 3s ease-in-out infinite;
    }

    /* This makes the second image delay its bounce slightly */
    .egg-img:nth-child(2) {
      animation-delay: 1.5s;
    }

    /* The bouncy floating animation */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .egg-card {
      background: white;
      padding: 30px;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      max-width: 500px;
      border: 4px solid #e0f7fa;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>YUMMY</h1>

  <div class="egg-gallery">
    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=500&auto=format&fit=crop" 
         alt="Mini Eggs" class="egg-img">
    
    <img src="https://cdn.pr.commerce.coop.co.uk/7622202338557_1_512x512_20251113.png" 
         alt="Easter Chocolate Egg" class="egg-img">
  </div>

  <div class="egg-card">
    <h2>Sweet Discoveries</h2>
    <p>We've gathered the most delicious treats in the garden. Can you find the hidden chocolate stash?</p>
  </div>

</body>
</html>
